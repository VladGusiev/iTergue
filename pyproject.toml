[project]
name = "itergue"
version = "0.1.0"
description = "Rogue like game for terminal"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.18",
    "ty>=0.0.61",
]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "I", "W"]   # E/F = current defaults, UP = pyupgrade modernization

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
itergue = "itergue.main:main"
